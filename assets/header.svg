<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Fasih Ul Haq, AI Solutions Architect and Founder of savv.pro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a14"/>
      <stop offset="1" stop-color="#0d1124"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.08" cy="0.05" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
    .flow { stroke-dasharray: 4 10; animation: flow 1.6s linear infinite; }
    .flow.slow { animation-duration: 2.6s; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .9; transform: scale(1.35); } }
    .live { animation: live 1.8s ease-in-out infinite; }
    @keyframes live { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .rise { opacity: 0; animation: rise .9s ease-out forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; } .d4 { animation-delay: .85s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#dotmask)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>

    <!-- Agent graph -->
    <g fill="none" stroke="url(#edge)" stroke-width="1.6">
      <path class="flow" d="M960 160 L850 92"/>
      <path class="flow slow" d="M960 160 L862 236"/>
      <path class="flow" d="M960 160 L1068 74"/>
      <path class="flow slow" d="M960 160 L1102 168"/>
      <path class="flow" d="M960 160 L1040 254"/>
      <path class="flow slow" d="M1068 74 L1102 168"/>
      <path class="flow slow" d="M850 92 L862 236"/>
    </g>

    <g class="mono" font-size="11" fill="#c7d2fe" text-anchor="middle">
      <!-- core -->
      <circle cx="960" cy="160" r="34" fill="#6366f1" fill-opacity="0.12" class="pulse"/>
      <circle cx="960" cy="160" r="24" fill="#111633" stroke="#818cf8" stroke-width="1.6"/>
      <text x="960" y="164" fill="#e0e7ff" font-weight="600">LLM</text>

      <circle cx="850" cy="92" r="17" fill="#0f1430" stroke="#6366f1" stroke-opacity=".7"/>
      <text x="850" y="62">agents</text>
      <circle cx="850" cy="92" r="4" fill="#a5b4fc"/>

      <circle cx="862" cy="236" r="17" fill="#0f1430" stroke="#6366f1" stroke-opacity=".7"/>
      <text x="862" y="272">memory</text>
      <circle cx="862" cy="236" r="4" fill="#a5b4fc"/>

      <circle cx="1068" cy="74" r="17" fill="#0f1430" stroke="#8b5cf6" stroke-opacity=".7"/>
      <text x="1068" y="44">RAG</text>
      <circle cx="1068" cy="74" r="4" fill="#c4b5fd"/>

      <circle cx="1102" cy="168" r="17" fill="#0f1430" stroke="#8b5cf6" stroke-opacity=".7"/>
      <text x="1102" y="206">tools</text>
      <circle cx="1102" cy="168" r="4" fill="#c4b5fd"/>

      <circle cx="1040" cy="254" r="17" fill="#0f1430" stroke="#6366f1" stroke-opacity=".7"/>
      <text x="1040" y="292">infra</text>
      <circle cx="1040" cy="254" r="4" fill="#a5b4fc"/>
    </g>

    <!-- Text -->
    <g class="rise d1">
      <rect x="64" y="58" width="236" height="28" rx="14" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.35"/>
      <circle cx="82" cy="72" r="4.5" fill="#34d399" class="live"/>
      <text x="94" y="77" class="mono" font-size="13" fill="#6ee7b7">available for new projects</text>
    </g>

    <text x="62" y="160" class="sans rise d2" font-size="64" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Fasih Ul Haq</text>

    <text x="64" y="202" class="sans rise d3" font-size="22" fill="#cbd5e1">
      AI Solutions Architect <tspan fill="#6366f1">/</tspan> Founder, <tspan fill="#a5b4fc" font-weight="600">savv.pro</tspan>
    </text>

    <text x="64" y="252" class="mono rise d4" font-size="14" fill="#94a3b8">
      <tspan fill="#818cf8">&gt;</tspan> agentic SaaS · RAG with memory · LLM fine-tuning · FastAPI · Kubernetes
    </text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
